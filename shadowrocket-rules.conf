# ==========================================
# Shadowrocket 规则订阅 (Surge 规则格式)
# 用途：手机经 Shadowrocket 连接家庭服务器/节点时的分流规则
# 同步方式：把本文件放到 GitHub → 复制 raw 链接 →
#          Shadowrocket → 配置 → 右上角 + → 添加规则订阅 → 粘贴链接
# 策略说明：
#   Proxy  = 走代理（你的家庭服务器 / 节点）
#   DIRECT = 直连（国内 / 不走代理）
#   REJECT = 拦截（本文件暂未使用）
# 注意：规则订阅不含 FINAL，FINAL 请在 Shadowrocket 主配置里设置
#       （建议 FINAL 设为 Proxy，未在下方列出的国外域名也会走代理）
# 提示：若你的策略名不是 "Proxy"，请把文件里的 Proxy 批量改成你实际的
#       策略/节点名（如机场名、URL-Test 等）；DIRECT 为内置无需改。
# ==========================================

# ==========================================
# 0. 国内直连（放在最前，优先匹配，避免国内流量绕家庭服务器）
# ==========================================
GEOIP,CN,DIRECT
DOMAIN-SUFFIX,cn,DIRECT
DOMAIN-SUFFIX,qq.com,DIRECT
DOMAIN-SUFFIX,baidu.com,DIRECT
DOMAIN-SUFFIX,taobao.com,DIRECT
DOMAIN-SUFFIX,bilibili.com,DIRECT
DOMAIN-SUFFIX,aliyundrive.com,DIRECT
# （如需更多国内域名直连，在此追加 DOMAIN-SUFFIX,xxx,DIRECT）

# ==========================================
# 1. GFW 核心分流
# 说明：Shadowrocket 不支持 PassWall2 的 geosite: 语法。
#       下方用「远程规则集」方式引入 GFW 列表（二选一，取消注释其一）：
# RULE-SET,https://raw.githubusercontent.com/xxx/gfwlist/raw/master/gfw.list,Proxy
# 若不需要 GFW 全量列表，下方手工整理的国外域名规则已覆盖绝大多数场景。
# ==========================================

